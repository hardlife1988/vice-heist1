name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./artifacts/vice-heist-pixi
        run: npm install

      - name: Build
        working-directory: ./artifacts/vice-heist-pixi
        run: npm run build

      - name: Copy build to docs
        run: |
          rm -rf docs
          mkdir -p docs
          cp -r artifacts/vice-heist-pixi/build/* docs/

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "Deploy: Update docs folder" || true
          git push
