name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies for vice-heist-pixi only
        working-directory: ./artifacts/vice-heist-pixi
        run: pnpm install

      - name: Build vice-heist-pixi
        working-directory: ./artifacts/vice-heist-pixi
        run: pnpm run build

      - name: Prepare deploy directory
        run: |
          mkdir -p /tmp/deploy
          cp -r artifacts/vice-heist-pixi/build/* /tmp/deploy/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/deploy

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/deploy

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
