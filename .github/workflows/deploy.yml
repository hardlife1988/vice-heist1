  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: ./artifacts/vice-heist-pixi
        run: npm install

      - name: Build
        working-directory: ./artifacts/vice-heist-pixi
        run: npm run build

      - name: Prepare deploy directory
        run: |
          mkdir -p /tmp/deploy
          cp -r artifacts/vice-heist-pixi/build/* /tmp/deploy/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/deploy
