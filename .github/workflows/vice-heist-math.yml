name: Vice Heist math generation

# Driven by workflow_dispatch so a run can be triggered on demand with a chosen
# scale. A small run (5k) is a design smoke test; a publish run is 100k per mode.
#
# Runs on a GitHub-hosted ubuntu-latest runner (4 vCPU / 16 GB), which is what
# this generation actually needs.
#
# NOTE: games/vice_heist/optimize_rtp.py is pure Python ("No Rust required") --
# the vendored optimization_program/ Rust crate is NOT used by this game, so no
# Rust toolchain step is needed here.
#
# The run commits library/VERIFY.json back to the branch. That is deliberate:
# it makes the gate verdict readable from the repository itself rather than only
# from run logs, so the numbers survive log retention and are reviewable in the
# commit history.

on:
  workflow_dispatch:
    inputs:
      num_sims:
        description: "Simulations per mode (5000 = smoke test, 100000 = publish scale)"
        required: true
        default: "5000"
      rtp:
        description: "Target RTP"
        required: true
        default: "0.96"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy zstandard scipy pandas toml xlsxwriter matplotlib

      - name: Report configured cap before running
        working-directory: math-sdk
        env:
          PYTHONPATH: ${{ github.workspace }}/math-sdk
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "games/vice_heist")
          from game_config import GameConfig
          c = GameConfig()
          print("wincap     :", c.wincap)
          print("rtp target :", c.rtp)
          for bm in c.bet_modes:
              qs = [(d.get_criteria(), d.get_quota()) for d in bm.get_distributions()]
              total = sum(q for _, q in qs)
              print(f"[{bm.get_name()}] cost={bm.get_cost()} quota_sum={total!r}")
              for crit, q in qs:
                  print(f"    {crit:<10} {q!r}")
              assert abs(total - 1.0) < 1e-9, f"{bm.get_name()} quotas do not sum to 1.0"
          PY

      - name: Generate books and optimise lookup tables
        working-directory: math-sdk
        env:
          VICE_HEIST_NUM_SIMS: ${{ inputs.num_sims }}
          VICE_HEIST_RTP: ${{ inputs.rtp }}
          PYTHONPATH: ${{ github.workspace }}/math-sdk
        run: python3 games/vice_heist/run.py

      - name: Verify against Stake 3-star RGS limits
        id: verify
        if: always()
        working-directory: math-sdk/games/vice_heist
        run: python3 verify_gate.py

      - name: Commit verification report
        if: always()
        working-directory: math-sdk/games/vice_heist
        run: |
          if [ ! -f library/VERIFY.json ]; then
            echo "no VERIFY.json produced; nothing to commit"
            exit 0
          fi
          git config user.name "vice-heist-ci"
          git config user.email "ci@users.noreply.github.com"
          cp library/VERIFY.json "$RUNNER_TEMP/VERIFY.json"
          [ -f library/cap_targets.json ] && cp library/cap_targets.json "$RUNNER_TEMP/cap_targets.json"
          git stash --include-untracked || true
          git pull --rebase || true
          mkdir -p library
          cp "$RUNNER_TEMP/VERIFY.json" library/VERIFY.json
          [ -f "$RUNNER_TEMP/cap_targets.json" ] && cp "$RUNNER_TEMP/cap_targets.json" library/cap_targets.json
          git add -f library/VERIFY.json library/cap_targets.json || git add -f library/VERIFY.json
          git commit -m "ci: gate report, run ${{ github.run_id }}, num_sims=${{ inputs.num_sims }}" \
            || { echo "no change to commit"; exit 0; }
          git push

      - name: Upload publish files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vice-heist-math-${{ inputs.num_sims }}
          path: |
            math-sdk/games/vice_heist/library/publish_files/
            math-sdk/games/vice_heist/library/VERIFY.json
            math-sdk/games/vice_heist/library/cap_targets.json
          if-no-files-found: error
          retention-days: 30
